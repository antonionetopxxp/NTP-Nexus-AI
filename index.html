<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>Nexus AI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">N</div>
        <div>
          <strong>Nexus AI</strong>
          <span>Assistente inteligente</span>
        </div>
      </div>

      <button class="new-chat" id="newChat">＋ Nova conversa</button>

      <div class="section-title">Conversas</div>
      <div id="chatList" class="chat-list"></div>

      <div class="sidebar-bottom">
        <button class="side-btn" id="settingsBtn">⚙ Configurações</button>
        <button class="side-btn" id="clearAllBtn">🗑 Limpar histórico</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn mobile-only" id="menuBtn">☰</button>
        <div>
          <strong>Nexus AI</strong>
          <small id="status">Verificando conexão...</small>
        </div>
        <div class="top-actions">
          <label class="toggle">
            <input type="checkbox" id="webSearch" />
            <span></span>
            Web
          </label>
          <button class="icon-btn" id="themeBtn" title="Alternar tema">◐</button>
        </div>
      </header>

      <section class="messages" id="messages">
        <div class="welcome" id="welcome">
          <div class="orb">✦</div>
          <h1>Como posso ajudar?</h1>
          <p>Converse, envie imagens e documentos, use sua voz ou ative a busca na web.</p>
          <div class="suggestions">
            <button data-prompt="Crie um plano de negócios simples para minha ideia.">Plano de negócios</button>
            <button data-prompt="Explique este assunto de forma simples e com exemplos.">Explicar um assunto</button>
            <button data-prompt="Crie um site moderno em HTML, CSS e JavaScript.">Criar um site</button>
            <button data-prompt="Analise o arquivo que vou enviar e faça um resumo.">Analisar arquivo</button>
          </div>
        </div>
      </section>

      <section class="composer-wrap">
        <div id="attachments" class="attachments"></div>
        <div class="composer">
          <input type="file" id="fileInput" multiple hidden
            accept="image/*,.pdf,.txt,.md,.csv,.json,.html,.css,.js,.doc,.docx" />
          <button class="tool-btn" id="attachBtn" title="Anexar arquivo">＋</button>
          <textarea id="prompt" rows="1" placeholder="Mensagem para Nexus AI..."></textarea>
          <button class="tool-btn" id="micBtn" title="Falar">🎙</button>
          <button class="send-btn" id="sendBtn" title="Enviar">➤</button>
        </div>
        <div class="composer-footer">
          <span>Enter envia · Shift+Enter quebra linha</span>
          <label><input type="checkbox" id="autoSpeak" /> Ler respostas</label>
        </div>
      </section>
    </main>
  </div>

  <dialog id="settingsDialog">
    <form method="dialog" class="settings-card">
      <div class="dialog-header">
        <h2>Configurações</h2>
        <button class="icon-btn">✕</button>
      </div>
      <label>
        Personalidade / instruções
        <textarea id="systemPrompt" rows="6"
          placeholder="Ex.: Você é meu assistente de negócios e tecnologia..."></textarea>
      </label>
      <label>
        Nome do assistente
        <input id="assistantName" value="Nexus AI" />
      </label>
      <div class="dialog-actions">
        <button value="cancel" class="secondary">Cancelar</button>
        <button value="default" id="saveSettings" class="primary">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
